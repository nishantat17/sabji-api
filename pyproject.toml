[project]
name = "sabji-api"
version = "0.1.0"
description = "A unified platform to buy and sell vegetables."
readme = "README.md"
authors = [
    { name = "Nishant Bhagat", email = "nishant17bhagat@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.163.1",
    "scalar-fastapi>=1.9.3",
]

[project.scripts]
sabji-api = "app:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
